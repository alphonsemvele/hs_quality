name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Block A / #59 — CI hardening:
#   - Pin PHP 8.3 (was 8.2; project requires 8.3+ now)
#   - Drop continue-on-error so static analysis + TS + lint actually fail builds
#   - Add `php-gd` extension (Wave 1 / H8 — required for photo upload)
#   - Add `npm audit --audit-level=high` parallel to `composer audit`
#   - Add load-test smoke step (k6 smoke.js — fast sanity check)

env:
  PHP_VERSION: '8.3'
  PHP_EXTENSIONS: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo, pdo_pgsql, pgsql, redis, zip

jobs:
  lint-and-analyze:
    name: Lint + static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          extensions: ${{ env.PHP_EXTENSIONS }}

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Pint (style check)
        run: vendor/bin/pint --test

      - name: Run Larastan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  security-scan:
    name: Dependency security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: composer audit
        run: composer audit --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm audit (high+)
        # Block A / #59 — match composer audit's strictness on the JS side.
        # Production dependencies only; dev deps are linters/test tools.
        run: npm audit --audit-level=high --omit=dev

  test:
    name: Pest tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qualite_domicile_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          extensions: ${{ env.PHP_EXTENSIONS }}, sqlite3, pdo_sqlite
          coverage: pcov

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy test env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run Pest
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: qualite_domicile_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_CLIENT: predis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          BROADCAST_CONNECTION: 'null'
          FILESYSTEM_DISK: local
          MAIL_MAILER: array
        run: php artisan test --parallel

  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run types

      - name: Lint
        run: npm run lint

      - name: Build assets
        run: npm run build
