    - generic [ref=e856]:
      - generic [ref=e857]: Questions fréquentes
      - heading "Tout ce que vous voulez savoir." [level=2] [ref=e858]
    - generic [ref=e859]:
      - generic [ref=e860]:
        - button "Que comprend exactement HS Quality ?" [expanded] [ref=e861]:
          - generic [ref=e862]: Que comprend exactement HS Quality ?
          - img [ref=e864]
        - paragraph [ref=e868]: "Une plateforme complète : suivi des interventions terrain (mobile + web), gestion des incidents et EI, audits qualité (HAS, AFNOR, ISO 9001, Caphandeo), baromètre QVCT, gestion des compétences et plans de soins. Tout est intégré et conforme HAS / RGPD / HDS."
      - generic [ref=e869]:
        - button "À quelle fréquence dois-je faire des audits qualité ?" [ref=e870]:
          - generic [ref=e871]: À quelle fréquence dois-je faire des audits qualité ?
          - img [ref=e873]
        - paragraph [ref=e875]: L'évaluation externe HAS doit avoir lieu tous les 5 ans. En interne, un point trimestriel est recommandé. HS Quality vous permet de programmer ces audits, de scorer en temps réel et de générer le PAC depuis les écarts détectés.
      - generic [ref=e876]:
        - button "Combien de temps pour mettre en place HS Quality ?" [ref=e877]:
          - generic [ref=e878]: Combien de temps pour mettre en place HS Quality ?
          - img [ref=e880]
        - paragraph [ref=e882]: Deux semaines en moyenne. Provisioning de votre tenant, import de vos bénéficiaires et intervenants, formation des coordinateurs (2h), puis déploiement progressif. Un référent qualité vous accompagne tout au long du pilote.
      - generic [ref=e883]:
        - button "Mes données sont-elles bien sécurisées ?" [ref=e884]:
          - generic [ref=e885]: Mes données sont-elles bien sécurisées ?
          - img [ref=e887]
        - paragraph [ref=e889]: Hébergement HDS en France (AWS Paris ou OVHcloud), chiffrement AES-256 au repos et TLS 1.3 en transit, MFA obligatoire pour les rôles privilégiés. Audit complet de chaque accès aux données de santé. Conformité RGPD et code de la santé publique.
      - generic [ref=e890]:
        - button "Puis-je essayer avant de m'engager ?" [ref=e891]:
          - generic [ref=e892]: Puis-je essayer avant de m'engager ?
          - img [ref=e894]
        - paragraph [ref=e896]: Oui, l'essai pilote est gratuit pendant 3 mois, sans carte bancaire et avec un référent dédié. Si la solution ne correspond pas à vos besoins, vos données sont restituées ou supprimées sur simple demande.
